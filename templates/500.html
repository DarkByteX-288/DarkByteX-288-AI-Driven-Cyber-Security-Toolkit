{% extends "base.html" %}
{% block title %}500 - Server Error - {{ app_name }}{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="fa-solid fa-server" style="font-size: 4rem; color: var(--accent-red);"></i>
    <h1 class="mt-3">500</h1>
    <p style="color: var(--text-secondary);">{{ message or "Something went wrong on our end. Please try again shortly." }}</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-cyber mt-2"><i class="fa-solid fa-house"></i> Go Home</a>
</div>
{% endblock %}
